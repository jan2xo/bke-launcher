name: Launcher exact-head contract certification

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact Launcher commit SHA to certify
        required: true
        type: string

permissions:
  contents: read

jobs:
  launcher-contracts:
    name: Launcher build + contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore BKE.Launcher.sln
      - name: Build
        run: dotnet build BKE.Launcher.sln -c Release --no-restore
      - name: Certify Launcher contracts
        run: dotnet run --project tests/BKE.Launcher.ContractCertification/BKE.Launcher.ContractCertification.csproj -c Release --no-build
      - name: Certify plugin contract
        run: dotnet run --project tests/BKE.Launcher.PluginCertification/BKE.Launcher.PluginCertification.csproj -c Release --no-build
