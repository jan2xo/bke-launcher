name: Intent Certification

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Launcher commit SHA to certify
        required: true
        type: string
      targets:
        description: Space/comma-separated certification targets, or full
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: launcher-intent-certification-${{ (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/certify ') && github.event.issue.number) || inputs.source_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  plan:
    name: Resolve certification intent
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/certify '))
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      agent_source_sha: ${{ steps.plan.outputs.agent_source_sha }}
      targets_json: ${{ steps.plan.outputs.targets_json }}
    steps:
      - id: plan
        name: Resolve exact head, upstream pin, and targets
        uses: actions/github-script@v7
        env:
          DISPATCH_SHA: ${{ inputs.source_sha }}
          DISPATCH_TARGETS: ${{ inputs.targets }}
        with:
          script: |
            const allowedTargets = ["contracts", "core", "parent"];
            const fullTargets = ["core", "parent"];
            let sourceSha;
            let requested;

            if (context.eventName === "issue_comment") {
              const association = context.payload.comment?.author_association ?? "NONE";
              const allowedAssociations = new Set(["OWNER", "MEMBER", "COLLABORATOR"]);
              if (!allowedAssociations.has(association)) {
                core.setFailed(`Certification command rejected for author association ${association}.`);
                return;
              }
              const issue = context.payload.issue;
              if (!issue?.pull_request) {
                core.setFailed("/certify is valid only on pull requests.");
                return;
              }
              const response = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: issue.number,
              });
              sourceSha = response.data.head.sha;
              requested = (context.payload.comment?.body ?? "")
                .replace(/^\/certify\s+/i, "")
                .trim();
            } else {
              sourceSha = (process.env.DISPATCH_SHA ?? "").trim();
              requested = (process.env.DISPATCH_TARGETS ?? "").trim();
            }

            if (!/^[0-9a-f]{40}$/i.test(sourceSha ?? "")) {
              core.setFailed("Certification requires an exact 40-character Launcher source SHA.");
              return;
            }

            const rawTokens = [...new Set(
              requested.toLowerCase().split(/[\s,]+/).map(v => v.trim()).filter(Boolean),
            )];
            if (rawTokens.length === 0) {
              core.setFailed("No certification targets were declared.");
              return;
            }

            let targets;
            if (rawTokens.includes("full") || rawTokens.includes("all")) {
              targets = fullTargets;
            } else {
              const unknown = rawTokens.filter(target => !allowedTargets.includes(target));
              if (unknown.length > 0) {
                core.setFailed(
                  `Unknown certification target(s): ${unknown.join(", ")}. Allowed: ${allowedTargets.join(", ")}.`,
                );
                return;
              }
              targets = rawTokens;
            }

            const pin = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: "eng/licensing-agent-source.sha",
              ref: sourceSha,
            });
            if (Array.isArray(pin.data) || pin.data.type !== "file" || typeof pin.data.content !== "string") {
              core.setFailed("Licensing Agent source pin is not a regular file.");
              return;
            }
            const agentSourceSha = Buffer
              .from(pin.data.content.replace(/\s/g, ""), "base64")
              .toString("utf8")
              .trim();
            if (!/^[0-9a-f]{40}$/i.test(agentSourceSha)) {
              core.setFailed("Licensing Agent source pin must be an exact 40-character SHA.");
              return;
            }

            core.setOutput("source_sha", sourceSha);
            core.setOutput("agent_source_sha", agentSourceSha);
            core.setOutput("targets_json", JSON.stringify(targets));

  contracts:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets_json), 'contracts')
    uses: ./.github/workflows/_intent-contracts.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}

  core:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets_json), 'core')
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}

  parent:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets_json), 'parent')
    uses: ./.github/workflows/windows-parent-installer.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      agent_source_sha: ${{ needs.plan.outputs.agent_source_sha }}

  required-certification:
    name: Required certification
    if: always() && needs.plan.result == 'success'
    needs: [plan, contracts, core, parent]
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      TARGETS_JSON: ${{ needs.plan.outputs.targets_json }}
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Verify declared certification plan
        shell: bash
        run: |
          node <<'NODE'
          const targets = JSON.parse(process.env.TARGETS_JSON);
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const failed = [];
          for (const target of targets) {
            const result = needs[target]?.result;
            if (result !== "success") failed.push(`${target}=${result ?? "missing"}`);
          }
          if (failed.length > 0) {
            console.error(`Required certification failed for ${process.env.SOURCE_SHA}: ${failed.join(", ")}`);
            process.exit(1);
          }
          console.log(`Required certification PASS for ${process.env.SOURCE_SHA}: ${targets.join(", ")}`);
          NODE
