name: BKE Launcher CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher-core:
    name: .NET 10 Launcher core + contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore BKE.Launcher.sln
      - name: Build
        run: dotnet build BKE.Launcher.sln -c Release --no-restore
      - name: Certify Launcher contracts
        run: dotnet run --project tests/BKE.Launcher.ContractCertification/BKE.Launcher.ContractCertification.csproj -c Release --no-build
      - name: Certify plugin contract
        run: dotnet run --project tests/BKE.Launcher.PluginCertification/BKE.Launcher.PluginCertification.csproj -c Release --no-build

  windows-candidates:
    name: Windows x64 + ARM64 self-contained candidates
    needs: launcher-core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained Windows Launchers
        shell: pwsh
        run: |
          dotnet publish src/BKE.Launcher.Desktop/BKE.Launcher.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o dist/windows-x64
          if ($LASTEXITCODE -ne 0) { throw "Launcher Windows x64 publish failed." }

          dotnet publish src/BKE.Launcher.Desktop/BKE.Launcher.Desktop.csproj `
            -c Release `
            -r win-arm64 `
            --self-contained true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o dist/windows-arm64
          if ($LASTEXITCODE -ne 0) { throw "Launcher Windows ARM64 publish failed." }

      - name: Smoke published x64 Launcher
        shell: pwsh
        run: |
          $exe = Resolve-Path ".\dist\windows-x64\bke-launcher.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--smoke" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Published Launcher x64 smoke failed: $($process.ExitCode)"
          }
          Write-Host "Published Launcher x64 smoke: PASS"

      - name: Verify published PE architectures
        shell: pwsh
        run: |
          function Assert-PeMachine([string]$Path,[int]$Expected) {
            $bytes=[IO.File]::ReadAllBytes((Resolve-Path $Path))
            $offset=[BitConverter]::ToInt32($bytes,0x3c)
            $signature="PE"+[char]0+[char]0
            if ([Text.Encoding]::ASCII.GetString($bytes,$offset,4) -ne $signature) {
              throw "invalid PE: $Path"
            }
            $machine=[BitConverter]::ToUInt16($bytes,$offset+4)
            if ($machine -ne $Expected) {
              throw ("wrong PE machine {0}: 0x{1:X4}" -f $Path,$machine)
            }
          }

          Assert-PeMachine ".\dist\windows-x64\bke-launcher.exe" 0x8664
          Assert-PeMachine ".\dist\windows-arm64\bke-launcher.exe" 0xAA64
          Write-Host "Launcher PE architecture verification: PASS"

      - name: Package candidates and SHA-256 evidence
        shell: pwsh
        run: |
          $targets = @(
            @{ Directory = ".\dist\windows-x64"; Name = "BKE-Launcher-Windows-x64-Candidate.zip" },
            @{ Directory = ".\dist\windows-arm64"; Name = "BKE-Launcher-Windows-arm64-Candidate.zip" }
          )

          foreach ($target in $targets) {
            $archive = Join-Path ".\dist" $target.Name
            if (Test-Path $archive) { Remove-Item $archive -Force }
            Compress-Archive -Path (Join-Path $target.Directory "*") -DestinationPath $archive -CompressionLevel Optimal
            if ((Get-Item $archive).Length -le 0) { throw "Launcher candidate archive is empty: $archive" }
            $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($target.Name)" |
              Set-Content ($archive + ".sha256.txt") -Encoding ascii
            Write-Host "$($target.Name) SHA256=$hash"
          }

      - name: Upload Windows candidates
        uses: actions/upload-artifact@v4
        with:
          name: bke-launcher-windows-candidates
          path: |
            dist/BKE-Launcher-Windows-x64-Candidate.zip
            dist/BKE-Launcher-Windows-x64-Candidate.zip.sha256.txt
            dist/BKE-Launcher-Windows-arm64-Candidate.zip
            dist/BKE-Launcher-Windows-arm64-Candidate.zip.sha256.txt
          if-no-files-found: error
          retention-days: 7
