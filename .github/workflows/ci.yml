name: BKE Launcher CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher-contracts:
    name: Fast contract gate
    uses: ./.github/workflows/_launcher-contracts.yml

  windows-candidate:
    name: Windows ${{ matrix.arch }} candidate
    needs: launcher-contracts
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained Windows Launcher
        shell: pwsh
        run: |
          $runtime = "win-${{ matrix.arch }}"
          $output = "dist/windows-${{ matrix.arch }}"
          dotnet publish src/BKE.Launcher.Desktop/BKE.Launcher.Desktop.csproj `
            -c Release `
            -r $runtime `
            --self-contained true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o $output
          if ($LASTEXITCODE -ne 0) { throw "Launcher ${{ matrix.arch }} publish failed." }

      - name: Smoke published x64 Launcher
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $exe = Resolve-Path ".\dist\windows-x64\bke-launcher.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--smoke" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Published Launcher x64 smoke failed: $($process.ExitCode)" }

      - name: Verify published PE architecture
        shell: pwsh
        run: |
          function Assert-PeMachine([string]$Path,[int]$Expected) {
            $bytes=[IO.File]::ReadAllBytes((Resolve-Path $Path))
            $offset=[BitConverter]::ToInt32($bytes,0x3c)
            $signature="PE"+[char]0+[char]0
            if ([Text.Encoding]::ASCII.GetString($bytes,$offset,4) -ne $signature) { throw "invalid PE: $Path" }
            $machine=[BitConverter]::ToUInt16($bytes,$offset+4)
            if ($machine -ne $Expected) { throw ("wrong PE machine {0}: 0x{1:X4}" -f $Path,$machine) }
          }
          $expected = if ("${{ matrix.arch }}" -eq "x64") { 0x8664 } else { 0xAA64 }
          Assert-PeMachine ".\dist\windows-${{ matrix.arch }}\bke-launcher.exe" $expected

      - name: Package candidate and SHA-256 evidence
        shell: pwsh
        run: |
          $name = "BKE-Launcher-Windows-${{ matrix.arch }}-Candidate.zip"
          $archive = Join-Path ".\dist" $name
          Compress-Archive -Path ".\dist\windows-${{ matrix.arch }}\*" -DestinationPath $archive -CompressionLevel Optimal -Force
          if ((Get-Item $archive).Length -le 0) { throw "Launcher candidate archive is empty: $archive" }
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content ($archive + ".sha256.txt") -Encoding ascii

      - name: Upload Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: bke-launcher-windows-${{ matrix.arch }}
          path: |
            dist/BKE-Launcher-Windows-${{ matrix.arch }}-Candidate.zip
            dist/BKE-Launcher-Windows-${{ matrix.arch }}-Candidate.zip.sha256.txt
          if-no-files-found: error
          retention-days: 7

  required-certification:
    name: Required certification
    if: ${{ always() }}
    needs: [launcher-contracts, windows-candidate]
    runs-on: ubuntu-latest
    steps:
      - name: Require all Launcher CI modules
        env:
          CONTRACTS: ${{ needs.launcher-contracts.result }}
          WINDOWS: ${{ needs.windows-candidate.result }}
        run: |
          test "$CONTRACTS" = "success" || { echo "launcher-contracts=$CONTRACTS"; exit 1; }
          test "$WINDOWS" = "success" || { echo "windows-candidate=$WINDOWS"; exit 1; }
          echo "Required Launcher certification: PASS"
